<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS Voltage & Power Visualizer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-v: #38bdf8;
            --accent-p: #f43f5e;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-v);
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .metric-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-value {
            font-size: 1.25rem;
            font-weight: bold;
            margin-top: 4px;
        }
        canvas {
            width: 100%;
            height: 180px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .canvas-label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RMS Voltage & Power Visualizer</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="voltageInput">Peak Voltage (V): <span id="voltageVal">10</span> V</label>
            <input type="range" id="voltageInput" min="1" max="50" step="1" value="10">
        </div>
        <div class="control-group">
            <label for="resistanceInput">Resistance (R): <span id="resistanceVal">1.0</span> Ohm</label>
            <input type="range" id="resistanceInput" min="0.1" max="10" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label for="dutyInput">Duty Cycle (On Time): <span id="dutyVal">50</span>%</label>
            <input type="range" id="dutyInput" min="10" max="100" step="1" value="50">
        </div>
    </div>

    <div class="metrics">
        <div class="metric-card">
            <label>Arithmetic Mean V</label>
            <div class="metric-value" id="meanV" style="color: var(--accent-v);">5.00 V</div>
        </div>
        <div class="metric-card">
            <label>RMS Voltage</label>
            <div class="metric-value" id="rmsV" style="color: var(--accent-v);">7.07 V</div>
        </div>
        <div class="metric-card">
            <label>Peak Power</label>
            <div class="metric-value" id="peakP" style="color: var(--accent-p);">100.0 W</div>
        </div>
        <div class="metric-card">
            <label>Average Power</label>
            <div class="metric-value" id="avgP" style="color: var(--accent-p);">50.0 W</div>
        </div>
    </div>

    <div class="canvas-label">Voltage Waveform over Time</div>
    <canvas id="voltageCanvas"></canvas>

    <div class="canvas-label">Instantaneous Power over Time (P = V^2 / R)</div>
    <canvas id="powerCanvas"></canvas>
</div>

<script>
    const voltageInput = document.getElementById('voltageInput');
    const resistanceInput = document.getElementById('resistanceInput');
    const dutyInput = document.getElementById('dutyInput');

    const voltageVal = document.getElementById('voltageVal');
    const resistanceVal = document.getElementById('resistanceVal');
    const dutyVal = document.getElementById('dutyVal');

    const meanVEl = document.getElementById('meanV');
    const rmsVEl = document.getElementById('rmsV');
    const peakPEl = document.getElementById('peakP');
    const avgPEl = document.getElementById('avgP');

    const vCanvas = document.getElementById('voltageCanvas');
    const pCanvas = document.getElementById('powerCanvas');
    const vCtx = vCanvas.getContext('2d');
    const pCtx = pCanvas.getContext('2d');

    function resizeCanvas() {
        [vCanvas, pCanvas].forEach(canvas => {
            canvas.width = canvas.parentElement.clientWidth - 48;
            canvas.height = 160;
        });
    }
    window.addEventListener('resize', update);

    function update() {
        const V_peak = parseFloat(voltageInput.value);
        const R = parseFloat(resistanceInput.value);
        const duty = parseFloat(dutyInput.value) / 100.0;

        voltageVal.textContent = V_peak;
        resistanceVal.textContent = R.toFixed(1);
        dutyVal.textContent = Math.round(duty * 100);

        // Calculations
        const V_mean = V_peak * duty;
        const V_rms = V_peak * Math.sqrt(duty);
        const P_peak = (V_peak ** 2) / R;
        const P_avg = P_peak * duty;

        meanVEl.textContent = V_mean.toFixed(2) + " V";
        rmsVEl.textContent = V_rms.toFixed(2) + " V";
        peakPEl.textContent = P_peak.toFixed(1) + " W";
        avgPEl.textContent = P_avg.toFixed(1) + " W";

        drawWaveform(vCtx, vCanvas, V_peak, duty, '#38bdf8', 'V', V_mean, V_rms);
        drawWaveform(pCtx, pCanvas, P_peak, duty, '#f43f5e', 'W', P_avg, null);
    }

    function drawWaveform(ctx, canvas, peakVal, duty, color, unit, avgVal, rmsVal) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const width = canvas.width;
        const height = canvas.height;
        const padding = 30;
        const graphWidth = width - padding * 2;
        const graphHeight = height - padding * 2;

        // Grid lines
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(padding, padding);
        ctx.lineTo(padding, height - padding);
        ctx.lineTo(width - padding, height - padding);
        ctx.stroke();
        ctx.setLineDash([]);

        const maxScaleY = peakVal * 1.2 || 1;

        // Draw Waveform (Square wave profile over 2 cycles)
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();

        const points = 400;
        for (let i = 0; i <= points; i++) {
            const t = (i / points) * 2; // 2 cycles
            const cyclePos = t % 1;
            const val = cyclePos < duty ? peakVal : 0;

            const x = padding + (i / points) * graphWidth;
            const y = height - padding - (val / maxScaleY) * graphHeight;

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Draw average line
        if (avgVal !== null) {
            const avgY = height - padding - (avgVal / maxScaleY) * graphHeight;
            ctx.strokeStyle = '#10b981';
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(padding, avgY);
            ctx.lineTo(width - padding, avgY);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = '#10b981';
            ctx.font = '10px system-ui';
            ctx.fillText(`Avg: ${avgVal.toFixed(1)} ${unit}`, width - padding - 80, avgY - 5);
        }

        // Axis Labels
        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px system-ui';
        ctx.fillText(peakVal.toFixed(0) + ' ' + unit, padding - 25, padding + 5);
        ctx.fillText('0', padding - 15, height - padding + 4);
    }

    [voltageInput, resistanceInput, dutyInput].forEach(input => {
        input.addEventListener('input', update);
    });

    resizeCanvas();
    update();
</script>

</body>
</html>
